name: Orbit Daily Posting

on:
  schedule:
    # 04:30 AM UTC (10:00 AM IST) - Asia Morning
    - cron: '30 4 * * *'
    # 10:30 AM UTC (04:00 PM IST) - Europe Morning / India Afternoon
    - cron: '30 10 * * *'
    # 04:30 PM UTC (10:00 PM IST) - US Morning / India Night
    - cron: '30 16 * * *'
    # 10:30 PM UTC (04:00 AM IST) - US Night / Asia Early Morning
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  run-orbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # Upgraded to v5 for Node 24

      - name: Set up Python
        uses: actions/setup-python@v6 # Upgraded to v6 for Node 24
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Orbit Main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Keep these for legacy support if needed
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }} 
        run: python main.py