name: Orbit Daily Posting

on:
  schedule:
    # 04:30 AM UTC (10:00 AM IST) - Asia Morning
    - cron: '30 4 * * *'
    # 10:30 AM UTC (04:00 PM IST) - Europe Morning / India Afternoon
    - cron: '30 10 * * *'
    # 04:30 PM UTC (10:00 PM IST) - US Morning / India Night
    - cron: '30 16 * * *'
    # 10:30 PM UTC (04:00 AM IST) - US Night / Asia Early Morning
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  run-orbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Orbit Main
        env:
          # Core API & Database
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
          # Threads Configuration
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USERNAME: ${{ secrets.THREADS_USERNAME }}
          
          # Legacy Fallback
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }} 
          
          # LangSmith Observability mapped directly to your Repo Secrets
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          
        run: python main.py